<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时 K 线与 L2 挂单分布</title><style>*{box-sizing:border-box}body{margin:24px;background:#111719;color:#e2ebed;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:24px}figure{margin:0}img{display:block;width:100%;border:1px solid #314045}p{color:#aec0bb;font-size:14px}</style><h1>实时 K 线与 L2 挂单分布</h1><p>同一组模拟行情，默认每秒更新 5 次。B/S 按信号的时间与成交价回标。点击图片查看原尺寸。</p><main><figure><figcaption><b>14　共轴盘口</b><p>同价位横向对齐 K 线与盘口</p></figcaption><a href="14.png"><img loading="lazy" src="14.png" alt="共轴盘口原图"></a></figure><figure><figcaption><b>15　盘口叠影</b><p>将挂单作为 K 线底图</p></figcaption><a href="15.png"><img loading="lazy" src="15.png" alt="盘口叠影原图"></a></figure><figure><figcaption><b>16　上下双窗</b><p>上方读走势，下方比各价位的挂单量</p></figcaption><a href="16.png"><img loading="lazy" src="16.png" alt="上下双窗原图"></a></figure><figure><figcaption><b>17　成交回标</b><p>在图下核对 B/S 的时间与价格</p></figcaption><a href="17.png"><img loading="lazy" src="17.png" alt="成交回标原图"></a></figure><figure><figcaption><b>18　盘口放大</b><p>盘口占主屏，保留带回标的缩略 K 线</p></figcaption><a href="18.png"><img loading="lazy" src="18.png" alt="盘口放大原图"></a></figure><figure><figcaption><b>19　侧栏仪表</b><p>将报价和时间放入左侧读数栏</p></figcaption><a href="19.png"><img loading="lazy" src="19.png" alt="侧栏仪表原图"></a></figure><figure><figcaption><b>20　无框夜读</b><p>纯黑留白，突出时间与价格</p></figcaption><a href="20.png"><img loading="lazy" src="20.png" alt="无框夜读原图"></a></figure><figure><figcaption><b>21　末段放大</b><p>放大最后 18 根，保留全段概览</p></figcaption><a href="21.png"><img loading="lazy" src="21.png" alt="末段放大原图"></a></figure><figure><figcaption><b>22　双翼挂单</b><p>买挂在左，卖挂在右，中间对照蜡烛</p></figcaption><a href="22.png"><img loading="lazy" src="22.png" alt="双翼挂单原图"></a></figure><figure><figcaption><b>23　琥珀阶梯</b><p>用阶梯高度比较两侧累计挂单量</p></figcaption><a href="23.png"><img loading="lazy" src="23.png" alt="琥珀阶梯原图"></a></figure></main></html>
