<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>整屏息屏预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1e2023;color:#ebe9e1;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1380px;padding:clamp(20px,4vw,60px);margin:auto}header{margin:0 0 clamp(27px,4vw,54px)}
h1{font-size:clamp(26px,3vw,40px);font-weight:620;letter-spacing:.02em;margin:0}p{margin:7px 0 0;color:#b8b8b4}
section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px clamp(22px,4vw,60px)}
figure{margin:0}a{display:block;overflow:hidden;border-radius:clamp(15px,2.1vw,30px);outline:1px solid #595a5d;background:#000}
a:focus-visible{outline:3px solid #cde2d5;outline-offset:4px}img{display:block;width:100%;height:auto}
figcaption{display:flex;align-items:baseline;gap:14px;padding:12px 1px 0;font-size:20px;font-weight:600}
figcaption span{font:16px ui-monospace,consolas,monospace;color:#b6b6ae}
@media(max-width:880px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:510px){section{grid-template-columns:minmax(0,1fr)}main{padding:20px}header{margin-bottom:24px}}
</style></head><body><main><header><h1>整屏息屏预览</h1>
<p>1080 × 2340 · 模拟行情 · 每秒 5 次更新的静态示意</p></header><section>
