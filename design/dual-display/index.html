<head>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--canvas:#121517;--ink:#e8eae6;--muted:#a6ada9;--line:#353c3c;--mint:#c1d7c7;--up:#eca08c;--down:#8fc9ad}
body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}
button,a,summary{-webkit-tap-highlight-color:transparent}
a{color:inherit}button,summary{cursor:pointer}button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mint);outline-offset:4px}
main{max-width:1512px;margin:auto;padding:clamp(20px,4vw,64px)}
header,.toolbar,.card-title,.live-head,.legend{display:flex;align-items:center;justify-content:space-between;gap:16px}
header{align-items:end;flex-wrap:wrap;margin-bottom:26px}
h1,h2,p,figure{margin:0}h1{font-size:clamp(27px,3.3vw,48px);line-height:1.22;font-weight:620;letter-spacing:-.045em}
header p,.toolbar p,.code,.legend,.archive{color:var(--muted)}
header p{margin-top:9px}.archive{display:inline-flex;min-height:44px;justify-content:center;align-items:center;padding:0 16px;border:1px solid var(--line);border-radius:5px;text-decoration:none;font-size:14px}.archive:hover{border-color:var(--muted);color:var(--ink)}
.toolbar{border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap;gap:9px}
.toolbar p{font-size:14px}.modes{display:inline-flex;gap:5px;padding:3px;border:1px solid var(--line);border-radius:8px}
.modes button{border:0;background:transparent;border-radius:5px;min-height:44px;padding:0 15px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--mint);color:#17251e;font-weight:650}
details{margin:16px 0 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
summary{padding:13px 0;font-size:15px;color:var(--ink)}summary::marker{color:var(--mint)}summary small{margin-left:12px;font-size:13px;color:var(--muted)}
.live{max-width:1030px;margin:2px auto 24px;padding:clamp(14px,2.6vw,32px);background:#0a0e0f;border:1px solid #343b39;border-radius:8px}
.live-head{flex-wrap:wrap;align-items:center}.quote{display:flex;align-items:baseline;gap:10px 16px;flex-wrap:wrap}
.quote h2{font-size:20px;font-weight:600}.price{font-size:clamp(27px,4vw,40px);font-weight:600;font-variant-numeric:tabular-nums}.delta{color:var(--up)}
.code,.delta,.clock{font-variant-numeric:tabular-nums}.code,.delta{font-size:14px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.clock{font-size:14px;color:var(--muted)}
.controls button{min-width:76px;min-height:44px;border-radius:5px;border:1px solid #505e58;background:transparent}
.legend{justify-content:flex-start;gap:6px 18px;flex-wrap:wrap;font-size:13px;margin:16px 0 3px}
.swatch{display:inline-block;vertical-align:middle;background:var(--up);width:15px;height:3px;margin-right:5px}.sell{background:var(--down)}
.plot{width:100%;display:block;overflow:visible}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,246px),1fr));gap:26px 20px;align-items:start}
.card-title{margin-bottom:9px;justify-content:flex-start;gap:11px;font-size:18px;font-weight:590}
.card-title span{color:var(--muted);font:14px/1.4 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.original{display:block;background:#000;line-height:0;outline:1px solid #303636;outline-offset:0}
.original:hover{outline-color:#879a90}.original img{display:block;width:100%;height:auto;aspect-ratio:1080/2340;object-fit:contain}
@media(max-width:650px){main{padding:20px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
header{margin-bottom:18px}.toolbar{padding-top:14px}.card-title{font-size:16px;gap:6px}.card-title span{font-size:12px}
.modes{gap:2px}.modes button{padding:0 10px;font-size:14px}.toolbar p{font-size:13px}.legend{font-size:12px}.live{padding:14px 8px}.live-head{gap:8px}summary small{margin-left:8px}
}
@media(max-width:400px){.toolbar p{width:100%}header{gap:10px}.archive{padding:0 11px}}
@media(min-width:651px) and (max-width:880px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

<script>
"use strict";
const sets={
  aod:[[104,"墨白宽字"],[105,"薄荷双叠"],[106,"矿蓝分栏"],[107,"暖沙错位"],[108,"点阵"],[109,"空心"],[110,"分秒"],[111,"长针"],[112,"月桂"],[113,"半墨"]],
  lock:[[95,"深夜书店"],[96,"雨停便利店"],[100,"桥影"],[101,"面摊"],[102,"跨江索道"]]
};
const gallery=document.getElementById("gallery");
function showMode(mode){
  const group=mode==="lock"?"锁屏":"熄屏常显";
  gallery.setAttribute("aria-label",group+"静态预览");
  gallery.replaceChildren(...sets[mode].map(([id,name])=>{
    const figure=document.createElement("figure");
    const caption=document.createElement("figcaption");
    caption.className="card-title";
    const number=document.createElement("span"); number.textContent=id;
    caption.append(number,name);
    const link=document.createElement("a"); link.className="original";
    link.href=mode+"/"+id+".png";link.target="_blank";link.rel="noopener";
    link.setAttribute("aria-label",id+" "+name+"，查看整屏原图");
    const img=document.createElement("img");img.src=link.getAttribute("href");img.alt=group+" · "+name;
    img.width=1080;img.height=2340;img.loading="lazy";img.decoding="async";
    link.append(img);figure.append(caption,link);return figure;
  }));
  for(const button of document.querySelectorAll("[data-mode]")){
    button.setAttribute("aria-pressed",String(button.dataset.mode===mode));
  }
}
for(const button of document.querySelectorAll("[data-mode]")){
  button.addEventListener("click",()=>showMode(button.dataset.mode));
}
showMode("aod");

const seed=JSON.parse(document.getElementById("market-seed").textContent);
const UP="#eca08c",DOWN="#8fc9ad",MUTED="#b7bfbb",GRID="#343b39";
const book=seed.ranks.map(side=>side.slice());
const bars=seed.candles.map((ohlc,index)=>({minute:seed.firstMinute+index,ohlc:ohlc.slice()}));
const fills=seed.fills;
const start=bars.at(-1).minute*60000,closeAt=15*60*60000;
let simTime=start,mid=seed.last,sequence=14032,paused=false,interval=null;
const root=document.getElementById("playback"),pause=document.getElementById("pause"),plot=document.getElementById("plot");
const priceEl=document.getElementById("quote"),deltaEl=document.getElementById("delta"),clock=document.getElementById("clock");
function random(){
  sequence=(Math.imul(1664525,sequence)+1013904223)>>>0;
  return sequence/4294967296;
}
const pad=n=>String(n).padStart(2,"0");
const stamp=minute=>pad(Math.floor(minute/60))+":"+pad(minute%60);
const price=cents=>(cents/100).toFixed(2);

function nextTick(){
  simTime+=200;
  if(simTime>=closeAt){simTime=closeAt;syncTimer();render();return}
  const minute=Math.floor(simTime/60000),previous=mid;
  const nudge=random()+(seed.last-mid)*.012;
  mid=Math.min(3620,Math.max(3540,mid+(nudge>.64?1:nudge<.36?-1:0)));
  if(bars.at(-1).minute<minute){
    bars.push({minute,ohlc:[previous,Math.max(previous,mid),Math.min(previous,mid),mid]});
    if(bars.length>seed.candles.length) bars.shift();
  }else{
    const tail=bars.at(-1).ohlc;
    tail[1]=Math.max(tail[1],mid);tail[2]=Math.min(tail[2],mid);tail[3]=mid;
  }
  for(const side of book){
    for(let change=0;change<3;change++){
      const rank=Math.floor(random()*(change===0?18:side.length));
      side[rank]=Math.max(4,Math.min(400,side[rank]+Math.round(random()*28)-14));
    }
  }
  render();
}
function syncTimer(){
  if(interval!==null){clearInterval(interval);interval=null}
  const ended=simTime>=closeAt;
  pause.disabled=ended;
  pause.textContent=ended?"已收盘":paused?"继续":"暂停";
  if(root.open&&!document.hidden&&!ended&&!paused) interval=setInterval(nextTick,200);
}
function depthProfile(low,high){
  const bins=Array.from({length:2},()=>Array(seed.bins).fill(0));
  for(let side=0;side<2;side++){
    const sign=side===0?-1:1;
    for(let rank=1;rank<=seed.requestedDepth;rank++){
      const level=mid+sign*rank;
      if(level<seed.priceLimits[0]||level>seed.priceLimits[1]) break;
      if(level<low||level>high) continue;
      const bin=Math.floor((level/100-low/100)/(high/100-low/100)*(seed.bins-1)+.5);
      bins[side][bin]+=book[side][rank-1]??22;
    }
  }
  return bins;
}
function render(){
  const minute=Math.floor(simTime/60000);
  clock.textContent=stamp(minute)+":"+pad(Math.floor(simTime/1000)%60);
  priceEl.textContent=price(mid);
  const pct=(mid/seed.previousClose-1)*100;
  deltaEl.textContent=(pct>=0?"+":"")+pct.toFixed(2)+"%";
  deltaEl.style.color=pct>=0?UP:DOWN;
  if(!root.open)return;
  const width=Math.max(245,Math.round(plot.getBoundingClientRect().width));
  const small=width<550,height=small?252:338;
  const x0=small?41:52,x1=width-5,y0=22,y1=height-28;
  const low=Math.min(seed.range[0],...bars.map(b=>b.ohlc[2]-6));
  const high=Math.max(seed.range[1],...bars.map(b=>b.ohlc[1]+6));
  const x=i=>x0+3+(x1-x0-6)*i/(bars.length-1);
  const y=cents=>y1-(cents-low)/(high-low)*(y1-y0);
  const svg=[];
  const line=(ax,ay,bx,by,color,w=1,attrs="")=>'<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" stroke="'+color+'" stroke-width="'+w+'" '+attrs+'/>';
  const label=(ax,ay,value,color,anchor="start",fontSize=12,weight=400)=>'<text x="'+ax+'" y="'+ay+'" fill="'+color+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-size="'+fontSize+'" font-weight="'+weight+'">'+value+'</text>';
  const bins=depthProfile(low,high),largest=Math.max(1,...bins.flat());
  svg.push('<g data-layer="book" opacity=".5">');
  bins.forEach((side,s)=>side.forEach((qty,slot)=>{
    if(qty===0)return;
    const cy=y(low+(high-low)*slot/(seed.bins-1));
    svg.push(line(x1-(x1-x0)*.34*qty/largest,cy,x1,cy,s?DOWN:UP,small?1.8:2.8,'data-slot="'+slot+'" data-lots="'+qty+'"'));
  }));
  svg.push('</g><g font-family="ui-monospace, Consolas, monospace">');
  const guides=[mid];
  for(let level=Math.ceil(low/10)*10;level<high;level+=10){
    if(Math.abs(y(level)-y(mid))>23)guides.push(level);
  }
  guides.forEach(level=>{
    svg.push(line(x0,y(level),x1,y(level),GRID,1,'stroke-dasharray="3 7"'));
    svg.push(label(0,y(level),price(level),MUTED,"start",small?11:13,level===mid?650:400));
  });
  const body=Math.max(1.4,(x1-x0)/bars.length*.59);
  svg.push('<g data-layer="candles">');
  bars.forEach(({minute,ohlc:[o,h,l,c]},i)=>{
    const cx=x(i),ink=c>=o?UP:DOWN;
    svg.push('<g data-minute="'+minute+'" data-ohlc="'+[o,h,l,c].join(",")+'"><title>'+stamp(minute)+'　开 '+price(o)+'　高 '+price(h)+'　低 '+price(l)+'　收 '+price(c)+'</title>');
    svg.push(line(cx,y(h),cx,y(l),ink,small?1:1.4));
    svg.push('<rect x="'+(cx-body/2)+'" y="'+Math.min(y(o),y(c))+'" width="'+body+'" height="'+Math.max(1.6,Math.abs(y(o)-y(c)))+'" fill="'+ink+'"/></g>');
  });
  svg.push('</g>');
  for(const fill of fills){
    const i=bars.findIndex(bar=>bar.minute===fill.minute);
    if(i<0)continue;
    const sell=fill.side==="S",sign=sell?-1:1,ink=sell?DOWN:UP,cx=x(i),cy=y(fill.price);
    const near=bars.slice(Math.max(0,i-1),i+2);
    const edge=sell?Math.max(...near.map(b=>b.ohlc[1])):Math.min(...near.map(b=>b.ohlc[2]));
    const tip=y(edge)+sign*4,foot=tip+sign*6;
    const tx=cx+9>x1-8?cx-9:cx+9;
    svg.push('<g data-fill="'+fill.side+'" data-minute="'+fill.minute+'" data-price="'+fill.price+'"><title>'+fill.side+' · '+stamp(fill.minute)+' · 成交价 '+price(fill.price)+'</title>');
    svg.push(line(cx,cy,cx,tip,ink,1.5));
    svg.push('<circle cx="'+cx+'" cy="'+cy+'" r="2.5" stroke="'+ink+'" fill="#0a0e0f"/><path d="M'+cx+' '+tip+'l-4 '+(sign*6)+'h8z" fill="'+ink+'"/>');
    svg.push(label(tx,foot,fill.side,ink,tx<cx?"end":"start",small?14:17,700),'</g>');
  }
  svg.push(line(x0,y1+4,x1,y1+4,GRID));
  const centerIndex=bars.findIndex(b=>b.minute%30===0&&b.minute>bars[8].minute&&b.minute<bars.at(-9).minute);
  const center=centerIndex<0?Math.floor(bars.length/2):centerIndex;
  for(const [i,anchor] of [[0,"start"],[center,"middle"],[bars.length-1,"end"]]){
    svg.push(label(x(i),height-8,stamp(bars[i].minute),MUTED,anchor,small?11:13));
  }
  svg.push('</g>');
  plot.setAttribute("viewBox","0 0 "+width+" "+height);
  plot.innerHTML=svg.join("");
}
root.addEventListener("toggle",()=>{syncTimer();render()});
pause.addEventListener("click",()=>{paused=!paused;syncTimer()});
document.addEventListener("visibilitychange",syncTimer);
new ResizeObserver(()=>{if(root.open)render()}).observe(plot.parentElement);
</script>
