<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机息屏 · 行情主题</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111417;color:#f0f0e9;font:16px system-ui,'Microsoft YaHei',sans-serif}main{max-width:1400px;margin:auto;padding:clamp(16px,4vw,48px)}header{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}h1{margin:0 0 6px;font-weight:560;font-size:clamp(24px,3.5vw,40px)}p{margin:0;color:#a2aeae;font-size:14px}nav{display:flex;gap:6px}button{cursor:pointer;border:1px solid #566060;border-radius:22px;padding:10px 15px;background:#111417;color:#d3d8d6;font:inherit}button[aria-pressed=true]{color:#10211d;background:#c5d5cc;border-color:#c5d5cc}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px}figure{margin:0}figcaption{font-size:20px;font-weight:600;margin-bottom:10px}figcaption span{font:16px ui-monospace,monospace;color:#a3ada9;margin-right:14px}a{display:block;background:black}img{display:block;width:100%;height:auto;object-fit:contain}.whole a{background:#1b2022;padding:12px}.whole img{height: min(70vh,640px)}@media(max-width:780px){section{grid-template-columns:1fr}}</style>
<main><header><div><h1>息屏行情</h1><p>模拟行情 · 一分钟 K 线 · 每秒 5 次 · B/S 回标与 L2 挂单</p></div><nav aria-label="预览视图"><button aria-pressed="true" data-mode="detail">行情细节</button><button aria-pressed="false" data-mode="phone">手机整屏</button></nav></header><section><figure><figcaption><span>44</span>金蚀</figcaption><a href="44-detail.png"><img loading="lazy" src="44-detail.png" data-id="44" alt="金蚀"></a></figure><figure><figcaption><span>45</span>汀墨</figcaption><a href="45-detail.png"><img loading="lazy" src="45-detail.png" data-id="45" alt="汀墨"></a></figure><figure><figcaption><span>46</span>深潜</figcaption><a href="46-detail.png"><img loading="lazy" src="46-detail.png" data-id="46" alt="深潜"></a></figure><figure><figcaption><span>47</span>红移</figcaption><a href="47-detail.png"><img loading="lazy" src="47-detail.png" data-id="47" alt="红移"></a></figure><figure><figcaption><span>48</span>鎏金</figcaption><a href="48-detail.png"><img loading="lazy" src="48-detail.png" data-id="48" alt="鎏金"></a></figure><figure><figcaption><span>49</span>蓝图</figcaption><a href="49-detail.png"><img loading="lazy" src="49-detail.png" data-id="49" alt="蓝图"></a></figure><figure><figcaption><span>50</span>琉璃</figcaption><a href="50-detail.png"><img loading="lazy" src="50-detail.png" data-id="50" alt="琉璃"></a></figure><figure><figcaption><span>51</span>熔岩</figcaption><a href="51-detail.png"><img loading="lazy" src="51-detail.png" data-id="51" alt="熔岩"></a></figure><figure><figcaption><span>52</span>织纹</figcaption><a href="52-detail.png"><img loading="lazy" src="52-detail.png" data-id="52" alt="织纹"></a></figure><figure><figcaption><span>53</span>黑胶</figcaption><a href="53-detail.png"><img loading="lazy" src="53-detail.png" data-id="53" alt="黑胶"></a></figure></section></main>
<script>for(const button of document.querySelectorAll('nav button'))button.onclick=()=>{const phone=button.dataset.mode==='phone';document.body.classList.toggle('whole',phone);for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',String(b===button));for(const img of document.images){const file=img.dataset.id+(phone?'':'-detail')+'.png';img.src=file;img.parentElement.href=file}}</script></html>
